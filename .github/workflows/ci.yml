name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version # exact version: skips the tag lookup on the GitHub API (504s) and gets cached
      - run: bun install --frozen-lockfile
      - name: Manifest is in sync with feature fragments
        shell: bash
        run: |
          bun run sync
          git diff --exit-code package.json || { echo "::error::package.json contributes is stale; run bun run sync"; exit 1; }
      - run: bun run package
      - name: Integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a bun run test
      - name: Integration tests
        if: runner.os != 'Linux'
        run: bun run test
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: vsix
          path: '*.vsix'
