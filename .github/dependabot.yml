version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for routine updates; majors still get their own PR.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Must match engines.vscode (^1.95.0); newer typings would allow APIs older VS Code builds lack.
      - dependency-name: '@types/vscode'
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
